<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NutraLiving</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <img src="img/logo.png" class="logo">

        <div class="tabs">
            <button id="btn-login" class="active">Entrar</button>
            <button id="btn-cadastro">Cadastrar</button>
        </div>

        <div id="aviso" class="caixa-aviso"> 
            <p id="mensagem-aviso"> </p>
            <button id="aviso-tela">Fechar</button>
        </div>

        <form action="/login" method="post" class="card" id="card-entrar">
            <label for="login-entrar"> Login </label>
            <input id="login-entrar" type="email" placeholder="Digite seu E-Mail de login">
            <label for="senha-entrar"> Senha </label>
            <input id="senha-entrar" type="password" placeholder="Digite a sua senha">
            <button type="submit"> ENTRAR </button>
        </form>

        <form action="/cadastrar" method="post" class="card" id="card-cadastrar" style="display: none;">
            <label for="login-cadastro"> Login </label>
            <input id="login-cadastro" type="email" placeholder="Digite o seu E-Mail">
            <label for="senha-cadastro"> Senha </label>
            <input id="senha-cadastro" type="password" placeholder="Digite sua senha">
            <label for="confirmar-senha-cadastro"> Confirmar Senha </label>
            <input id="confirmar-senha-cadastro" type="password" placeholder="Digite a senha novamente">
            <button type="submit"> CADASTRAR </button>
            <div class="regras-senha">
                <p id="regra-tamanho" data-texto="Minimo 8 e maximo 22 caracteres">[ X ] Minimo 8 e maximo 22 caracteres</p>
                <p id="regra-maiuscula" data-texto="1 Letra Maiuscula">[ X ] 1 Letra Maiuscula</p>
                <p id="regra-minuscula" data-texto="1 Letra Minuscula">[ X ] 1 Letra Minuscula</p>
                <p id="regra-especial" data-texto="1 Caracter Especial (!@#$)">[ X ] 1 Caracter Especial (!@#$)</p>
                <p id="regra-numero" data-texto="1 Numero">[ X ] 1 Numero</p>
            </div>
        </form>


    </div>


    <script type="module" src="app.js"></script>
</body>
</html>
